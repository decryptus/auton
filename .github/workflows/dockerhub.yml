name: Docker Hub
on:
  push:
    branches: [master, release/2.0]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: auton-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release selection
        run: |
          python3 .github/scripts/check-test-collection.py --runner unittest .github/tests
          python3 -m unittest discover -s .github/tests -v
      - name: Select release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/select-release.sh
      - name: Check out selected release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: auton:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image before publication
        run: |
          docker run --rm --entrypoint autond auton:test -d
          docker build --target test -t auton:tests .
          docker run --rm --entrypoint python -v "$PWD/.github/scripts:/collection:ro" auton:tests /collection/check-test-collection.py --runner unittest tests
          docker run --rm --entrypoint python auton:tests -m unittest discover -s tests -v
          docker run --rm --entrypoint python -e EXPECTED_VERSION="$(cat VERSION)" auton:test -c 'import os; from importlib.metadata import version; assert version("autond") == os.environ["EXPECTED_VERSION"]; assert os.getuid() != 0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          AUTON_PACKAGE=auton python -m build --outdir dist/auton
          AUTON_PACKAGE=autond python -m build --outdir dist/autond
          python -m twine check --strict dist/auton/* dist/autond/*
          python .github/scripts/check-distributions.py auton autond
      - name: Verify installed packages and 0.3.2 compatibility
        run: python .github/scripts/check-installed-release.py
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' || contains(steps.release.outputs.tag, 'rc')
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check Docker Hub credentials
        if: steps.release.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.release.outputs.publish == 'true'
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create version tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA"
      - name: Publish tested image
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag auton:test "decryptus/auton:${TAG#v}"
          docker tag auton:test "decryptus/auton:$TAG"
          docker push "decryptus/auton:${TAG#v}"
          docker push "decryptus/auton:$TAG"

  pypi:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    concurrency:
      group: auton-pypi-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: [auton, autond]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true

  github-release:
    needs: [release, pypi]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: auton-github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish release notes after image and both packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          # Existing published releases remain immutable on a workflow retry.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *rc* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/auton/* dist/autond/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
            --title "Auton ${RELEASE_TAG#v}" --notes-file "docs/release-${RELEASE_TAG#v}.md"
