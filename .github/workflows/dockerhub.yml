name: Docker Hub
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: auton-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release selection
        run: python3 -m unittest discover -s .github/tests -v
      - name: Select release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/select-release.sh
      - name: Check out selected release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: auton:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image before publication
        run: |
          docker run --rm --entrypoint autond auton:test -d
          docker run --rm --entrypoint python auton:test -m unittest discover -s tests -v
          docker run --rm --entrypoint python -e EXPECTED_VERSION="$(cat VERSION)" auton:test -c 'import os; from importlib.metadata import version; assert version("autond") == os.environ["EXPECTED_VERSION"]; assert os.getuid() != 0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          AUTON_PACKAGE=auton python -m build --outdir dist/auton
          AUTON_PACKAGE=autond python -m build --outdir dist/autond
          python -m twine check --strict dist/auton/* dist/autond/*
          python .github/scripts/check-distributions.py auton autond
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check Docker Hub credentials
        if: steps.release.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - uses: docker/login-action@v4
        if: steps.release.outputs.publish == 'true'
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create version tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA"
      - name: Publish tested image
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag auton:test "decryptus/auton:${TAG#v}"
          docker tag auton:test "decryptus/auton:$TAG"
          docker push "decryptus/auton:${TAG#v}"
          docker push "decryptus/auton:$TAG"

  pypi:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    concurrency:
      group: auton-pypi-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: [auton, autond]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true
